<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短密文加密系統</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6fb,#10131b);--panel:light-dark(#fff,#191e29);--text:light-dark(#202638,#edf1fa);--muted:light-dark(#697386,#9ba7bb);--border:light-dark(#dce2ed,#333c4d);--accent:#7165f5;--input:light-dark(#f8f9fd,#111621)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}main{max-width:820px;margin:0 auto;padding:38px 20px}h1{font-size:27px;margin-bottom:8px}.desc{color:var(--muted);line-height:1.7}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;margin-top:24px}.modes{display:flex;gap:10px;margin-bottom:22px}button{font:inherit;cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:11px 16px;background:var(--input);color:var(--text)}button:disabled{opacity:.6;cursor:wait}.modes button{flex:1}button.active,button.primary{background:var(--accent);color:white;border-color:var(--accent)}label{display:block;font-weight:650;margin:14px 0 9px}textarea{width:100%;min-height:140px;resize:vertical;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--input);color:var(--text);font:14px/1.7 ui-monospace,monospace}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}.status{margin-top:14px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.note{margin-top:18px;padding:13px;border-radius:10px;background:var(--input);color:var(--muted);font-size:13px;line-height:1.7}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.history-head h2{font-size:19px;margin:0}.history-list{display:grid;gap:12px;margin-top:18px}.entry{border:1px solid var(--border);border-radius:12px;padding:14px}.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:10px}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0;line-height:1.6}.entry-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.entry-actions button{padding:7px 10px;font-size:13px}.empty{color:var(--muted);font-size:14px;padding:14px 0}.section-label{font-size:12px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>短密文加密系統</h1>
  <div class="desc">自動壓縮、加密與解密，並在此瀏覽器保存明文紀錄。</div>
  <section class="panel">
    <div class="modes"><button id="inputMode" class="active">input · 加密</button><button id="outputMode">output · 解密</button></div>
    <label id="inputLabel" for="source">輸入明文</label>
    <textarea id="source" placeholder="輸入你要加密的文字……"></textarea>
    <div class="actions"><button id="run" class="primary">執行加密</button><button id="clear">清空</button></div>
    <label for="result">Output 結果</label>
    <textarea id="result" readonly placeholder="結果會顯示在這裡……"></textarea>
    <div class="actions"><button id="copy">複製結果</button><button id="swap">將結果移至輸入框</button></div>
    <div id="status" class="status">等待輸入。</div>
  </section>
  <section class="panel">
    <div class="history-head"><h2>明文紀錄</h2><button id="clearHistory">清除全部紀錄</button></div>
    <div class="desc">加密成功後會記錄原始明文、時間及對應密文；解密成功也會記錄還原的明文。</div>
    <div id="historyList" class="history-list"></div>
  </section>
  <div class="note">加密流程：GZIP 壓縮 → AES-256-GCM 加密。示範版金鑰寫在程式碼內，只適合練習。明文紀錄儲存在此瀏覽器的 localStorage；共用電腦上請勿保存敏感內容。清除瀏覽器網站資料也可能刪除紀錄。</div>
</main>
<script>
const $=id=>document.getElementById(id);let mode="input";
function setMode(next){mode=next;$('inputMode').classList.toggle('active',mode==='input');$('outputMode').classList.toggle('active',mode==='output');$('inputLabel').textContent=mode==='input'?'輸入明文':'輸入密文';$('source').placeholder=mode==='input'?'輸入你要加密的文字……':'貼上先前產生的密文……';$('run').textContent=mode==='input'?'執行加密':'執行解密';$('status').textContent=mode==='input'?'等待輸入明文。':'等待輸入密文。'}
$('inputMode').onclick=()=>setMode('input');$('outputMode').onclick=()=>setMode('output');
const encoder=new TextEncoder(),decoder=new TextDecoder('utf-8',{fatal:true});
const SECRET='demo-key-change-this-before-real-use';
async function getKey(){const raw=await crypto.subtle.digest('SHA-256',encoder.encode(SECRET));return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt'])}
async function transform(data,compress){const Stream=compress?CompressionStream:DecompressionStream;if(!Stream)throw new Error('瀏覽器不支援串流壓縮功能。');const stream=new Blob([data]).stream().pipeThrough(new Stream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer())}
function toBase64URL(bytes){let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'')}
function fromBase64URL(text){if(!/^[A-Za-z0-9_-]+$/.test(text))throw new Error('密文格式不正確。');let base64=text.replace(/-/g,'+').replace(/_/g,'/');base64+='='.repeat((4-base64.length%4)%4);return Uint8Array.from(atob(base64),c=>c.charCodeAt(0))}
async function encrypt(text){const compressed=await transform(encoder.encode(text),true),iv=crypto.getRandomValues(new Uint8Array(12)),key=await getKey();const encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,compressed));const packet=new Uint8Array(1+iv.length+encrypted.length);packet[0]=1;packet.set(iv,1);packet.set(encrypted,13);return 'C1.'+toBase64URL(packet)}
async function decrypt(text){if(!text.startsWith('C1.'))throw new Error('無效的密文：缺少 C1. 版本標記。');const packet=fromBase64URL(text.slice(3));if(packet.length<30||packet[0]!==1)throw new Error('密文長度不足或版本不支援。');const iv=packet.slice(1,13),ciphertext=packet.slice(13),key=await getKey();const decrypted=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext));return decoder.decode(await transform(decrypted,false))}
const HISTORY_KEY='shortCipherPlaintextHistoryV1';
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{return []}}
function saveHistory(text,cipher,action){const items=getHistory();items.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),time:new Date().toLocaleString(),text,cipher,action});localStorage.setItem(HISTORY_KEY,JSON.stringify(items.slice(0,100)));renderHistory()}
function renderHistory(){const list=$('historyList'),items=getHistory();list.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='目前沒有明文紀錄。';list.append(empty);return}for(const item of items){const card=document.createElement('article');card.className='entry';const top=document.createElement('div');top.className='entry-top';const time=document.createElement('span');time.textContent=item.time+' · '+(item.action==='input'?'加密':'解密');const del=document.createElement('button');del.textContent='刪除此筆';del.onclick=()=>{localStorage.setItem(HISTORY_KEY,JSON.stringify(getHistory().filter(x=>x.id!==item.id)));renderHistory()};top.append(time,del);const label=document.createElement('div');label.className='section-label';label.textContent='明文';const plain=document.createElement('p');plain.textContent=item.text;const cipherLabel=document.createElement('div');cipherLabel.className='section-label';cipherLabel.textContent='對應密文';const cipher=document.createElement('p');cipher.textContent=item.cipher;const actions=document.createElement('div');actions.className='entry-actions';const reuse=document.createElement('button');reuse.textContent='載入明文';reuse.onclick=()=>{$('source').value=item.text;setMode('input');window.scrollTo({top:0,behavior:'smooth'})};const copyPlain=document.createElement('button');copyPlain.textContent='複製明文';copyPlain.onclick=async()=>{try{await navigator.clipboard.writeText(item.text);$('status').textContent='已複製紀錄中的明文。'}catch{$('status').textContent='無法自動複製，請手動選取明文。'}};const reuseCipher=document.createElement('button');reuseCipher.textContent='載入密文';reuseCipher.onclick=()=>{$('source').value=item.cipher;setMode('output');window.scrollTo({top:0,behavior:'smooth'})};actions.append(reuse,copyPlain,reuseCipher);card.append(top,label,plain,cipherLabel,cipher,actions);list.append(card)}}
$('run').onclick=async()=>{const text=$('source').value;if(!text.trim()){$('status').textContent='請先輸入內容。';return}$('run').disabled=true;$('status').textContent='處理中……';try{if(!crypto.subtle)throw new Error('請在支援 Web Crypto 的安全環境中開啟。');if(mode==='input'){const result=await encrypt(text);$('result').value=result;saveHistory(text,result,'input');$('status').textContent=`加密完成。明文 ${encoder.encode(text).length} bytes；密文 ${encoder.encode(result).length} bytes。明文已記錄。`}else{const plain=await decrypt(text);$('result').value=plain;saveHistory(plain,text,'output');$('status').textContent='解密成功，原文已還原並記錄。'}}catch(error){$('result').value='';$('status').textContent='處理失敗：'+error.message}finally{$('run').disabled=false}};
$('clear').onclick=()=>{$('source').value='';$('result').value='';$('status').textContent='已清空。'};
$('copy').onclick=async()=>{if(!$('result').value){$('status').textContent='目前沒有可複製的結果。';return}try{await navigator.clipboard.writeText($('result').value);$('status').textContent='已複製結果。'}catch{$('result').focus();$('result').select();$('status').textContent='請使用 Ctrl+C 複製。'}};
$('swap').onclick=()=>{if(!$('result').value)return;$('source').value=$('result').value;$('result').value='';setMode(mode==='input'?'output':'input');$('status').textContent='內容已移至輸入框。'};
$('clearHistory').onclick=()=>{if(!getHistory().length){$('status').textContent='沒有可清除的紀錄。';return}if(confirm('確定要永久清除所有明文紀錄嗎？')){localStorage.removeItem(HISTORY_KEY);renderHistory()}};
renderHistory();
</script>
</body>
</html>
