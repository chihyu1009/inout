
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短密文加密系統</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f6fb, #10131b);
  --panel: light-dark(#ffffff, #191e29);
  --text: light-dark(#202638, #edf1fa);
  --muted: light-dark(#697386, #9ba7bb);
  --border: light-dark(#dce2ed, #333c4d);
  --accent: #7165f5;
  --input: light-dark(#f8f9fd, #111621);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 38px 20px;
}
h1 { font-size: 27px; margin-bottom: 8px; }
.desc { color: var(--muted); line-height: 1.7; }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-top: 24px;
}
.modes {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
}
button {
  font: inherit;
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 16px;
  background: var(--input);
  color: var(--text);
}
.modes button { flex: 1; }
button.active, button.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
label {
  display: block;
  font-weight: 650;
  margin: 14px 0 9px;
}
textarea {
  width: 100%;
  min-height: 160px;
  resize: vertical;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--input);
  color: var(--text);
  font: 14px/1.7 ui-monospace, monospace;
}
.actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.actions button { flex: 1; }
.status {
  margin-top: 14px;
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}
.note {
  margin-top: 18px;
  padding: 13px;
  border-radius: 10px;
  background: var(--input);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}
</style>
</head>
<body>
<main>
  <h1>短密文加密系統</h1>
  <div class="desc">
    自動壓縮、加密與解密。選擇模式，貼上文字即可操作。
  </div>

  <section class="panel">
    <div class="modes">
      <button id="inputMode" class="active">input · 加密</button>
      <button id="outputMode">output · 解密</button>
    </div>

    <label id="inputLabel" for="source">輸入明文</label>
    <textarea id="source"
      placeholder="輸入你要加密的文字……"></textarea>

    <div class="actions">
      <button id="run" class="primary">執行</button>
      <button id="clear">清空</button>
    </div>

    <label for="result">Output 結果</label>
    <textarea id="result" readonly
      placeholder="結果會顯示在這裡……"></textarea>

    <div class="actions">
      <button id="copy">複製結果</button>
      <button id="swap">將結果移至輸入框</button>
    </div>

    <div id="status" class="status">等待輸入。</div>
  </section>

  <div class="note">
    加密流程：GZIP 壓縮 → AES-256-GCM 加密。
    解密時自動反向還原。相同文字每次可能產生不同密文。
    <br>
    注意：本範例使用內建示範金鑰，只適合練習；
    正式使用應改用由使用者提供的密碼及安全的金鑰衍生流程。
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

let mode = "input";

function setMode(next) {
  mode = next;
  $("inputMode").classList.toggle("active", mode === "input");
  $("outputMode").classList.toggle("active", mode === "output");
  $("inputLabel").textContent =
    mode === "input" ? "輸入明文" : "輸入密文";
  $("source").placeholder =
    mode === "input"
      ? "輸入你要加密的文字……"
      : "貼上先前產生的密文……";
  $("run").textContent =
    mode === "input" ? "執行加密" : "執行解密";
  $("status").textContent =
    mode === "input" ? "等待輸入明文。" : "等待輸入密文。";
}

$("inputMode").onclick = () => setMode("input");
$("outputMode").onclick = () => setMode("output");

const encoder = new TextEncoder();
const decoder = new TextDecoder("utf-8", { fatal: true });

// 示範用途：金鑰寫在前端程式碼內，任何人都能讀取。
const SECRET = "demo-key-change-this-before-real-use";

async function getKey() {
  const raw = await crypto.subtle.digest(
    "SHA-256", encoder.encode(SECRET)
  );
  return crypto.subtle.importKey(
    "raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]
  );
}

async function transform(data, compress) {
  const Stream = compress ? CompressionStream : DecompressionStream;
  if (!Stream) throw new Error("瀏覽器不支援串流壓縮功能。");

  const stream = new Blob([data]).stream().pipeThrough(new Stream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function toBase64URL(bytes) {
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");
}

function fromBase64URL(text) {
  if (!/^[A-Za-z0-9_-]+$/.test(text)) {
    throw new Error("密文格式不正確。");
  }
  let base64 = text.replace(/-/g, "+").replace(/_/g, "/");
  base64 += "=".repeat((4 - base64.length % 4) % 4);
  return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
}

async function encrypt(text) {
  const compressed = await transform(encoder.encode(text), true);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await getKey();

  const encrypted = new Uint8Array(
    await crypto.subtle.encrypt(
      { name: "AES-GCM", iv }, key, compressed
    )
  );

  // 格式：版本標記 + 隨機 IV + 加密資料
  const packet = new Uint8Array(1 + iv.length + encrypted.length);
  packet[0] = 1;
  packet.set(iv, 1);
  packet.set(encrypted, 13);

  return "C1." + toBase64URL(packet);
}

async function decrypt(text) {
  if (!text.startsWith("C1.")) {
    throw new Error("無效的密文：缺少 C1. 版本標記。");
  }

  const packet = fromBase64URL(text.slice(3));
  if (packet.length < 30 || packet[0] !== 1) {
    throw new Error("密文長度不足或版本不支援。");
  }

  const iv = packet.slice(1, 13);
  const ciphertext = packet.slice(13);
  const key = await getKey();

  const decrypted = new Uint8Array(
    await crypto.subtle.decrypt(
      { name: "AES-GCM", iv }, key, ciphertext
    )
  );

  const original = await transform(decrypted, false);
  return decoder.decode(original);
}

$("run").onclick = async () => {
  const text = $("source").value;
  if (!text.trim()) {
    $("status").textContent = "請先輸入內容。";
    return;
  }

  $("run").disabled = true;
  $("status").textContent = "處理中……";

  try {
    if (!crypto.subtle) {
      throw new Error("需要在支援 Web Crypto 的安全環境中開啟。");
    }

    const result = mode === "input"
      ? await encrypt(text)
      : await decrypt(text);

    $("result").value = result;
    $("status").textContent =
      mode === "input"
        ? `加密完成。明文 ${encoder.encode(text).length} bytes；密文 ${encoder.encode(result).length} bytes。`
        : "解密成功，原文已還原。";
  } catch (error) {
    $("result").value = "";
    $("status").textContent =
      "處理失敗：" + error.message;
  } finally {
    $("run").disabled = false;
  }
};

$("clear").onclick = () => {
  $("source").value = "";
  $("result").value = "";
  $("status").textContent = "已清空。";
};

$("copy").onclick = async () => {
  if (!$("result").value) {
    $("status").textContent = "目前沒有可複製的結果。";
    return;
  }
  try {
    await navigator.clipboard.writeText($("result").value);
    $("status").textContent = "已複製結果。";
  } catch {
    $("result").focus();
    $("result").select();
    $("status").textContent = "請使用 Ctrl+C 複製。";
  }
};

$("swap").onclick = () => {
  if (!$("result").value) return;
  $("source").value = $("result").value;
  $("result").value = "";
  setMode(mode === "input" ? "output" : "input");
  $("status").textContent = "內容已移至輸入框。";
};
</script>
</body>
</html>
